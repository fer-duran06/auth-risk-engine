# Configuración base: todo valor sensible o dependiente del entorno viene de variables de entorno.
# Para desarrollo local se importa opcionalmente el .env de la raíz del monorepo
# (las variables de entorno reales del sistema siempre tienen prioridad).
spring:
  application:
    name: authshield
  config:
    import: optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # Cortos a propósito: si Redis no responde, el login cae rápido al fail-safe (CHALLENGE).
      timeout: 500ms
      connect-timeout: 500ms

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  # "native" activa el RemoteIpValve de Tomcat: reescribe getRemoteAddr()/isSecure() a partir de
  # X-Forwarded-For/X-Forwarded-Proto, pero solo cuando la conexión TCP entrante viene de una IP
  # de las redes "internas" (rangos privados RFC1918 + loopback, por defecto en Tomcat). En este
  # despliegue el backend no tiene dominio público: solo el contenedor del frontend puede conectarse
  # (red privada de Railway), así que ese salto es el único que se trata como proxy de confianza.
  # Si la infraestructura cambia y el proxy de borde queda en otro rango, ajustar
  # server.tomcat.remoteip.internal-proxies.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Swagger desactivado por defecto; solo el perfil dev lo habilita.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # Clave HS256 (mínimo 32 bytes). Sin valor por defecto: la app no arranca si falta.
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: authshield
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # Secure en la cookie de refresh: activo salvo que el perfil o la variable lo desactiven.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  # 2FA con TOTP (RFC 6238: SHA-1, 6 dígitos, 30 s, ±1 paso).
  two-factor:
    # AES-256-GCM para el secreto TOTP: base64 de 32 bytes. Sin valor por defecto: la app no arranca si falta.
    encryption-key: ${TOTP_ENCRYPTION_KEY:}
    issuer: AuthShield
    challenge-ttl: 5m       # vigencia del challengeId de la zona CHALLENGE
    max-attempts: 5         # intentos de verificación por challengeId
    cleanup-interval: 5m    # purga de desafíos vencidos o cerrados
  # Acepta el header X-Simulated-IP (simulador). Solo el perfil dev lo activa.
  demo-mode: false
  # Motor de riesgo. Cada regla suma su peso si su contador llega al umbral dentro de la ventana.
  # Los contadores son de intentos previos (no incluyen el intento que se evalúa).
  risk:
    # false omite la evaluación (todo ALLOW, sin Redis). Solo para el simulador; exige demo-mode=true.
    enabled: ${RISK_ENABLED:true}
    thresholds:
      challenge: 30   # score >= 30 -> CHALLENGE
      block: 70       # score >= 70 -> BLOCK (el score se acota a 100)
    rules:
      ip-velocity:
        weight: 30
        threshold: 10       # intentos desde la IP
        window: 1m
      distinct-users-per-ip:
        weight: 25
        threshold: 5        # emails distintos desde la IP
        window: 10m
      account-failures:
        weight: 20
        threshold: 5        # fallos contra el mismo email
        window: 15m
      global-failure-rate:
        weight: 15
        ratio: 0.5          # proporción de fallos en todo el sistema
        min-attempts: 20    # volumen mínimo para evaluar la proporción
        window: 5m          # en buckets de 1 minuto
      global-distinct-accounts:
        weight: 20
        threshold: 20       # cuentas distintas con fallo, en toda la plataforma (no por IP)
        window: 2m
  # Límite de solicitudes por IP a los endpoints sensibles de autenticación (capa de perímetro,
  # independiente del motor de riesgo; ver RateLimitFilter).
  rate-limit:
    enabled: true
    capacity: 60
    window: 1m
